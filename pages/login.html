<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Agro-Shield</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-left">

        <img
            id="auth-background"
            class="background-image"
            src="../assets/images/login-image1.jpeg"
            alt="Farmer"
        >

        <div class="overlay"></div>

        <div class="left-content">

            <h1>Welcome Back</h1>

            <p>
                Sign in to continue managing your farm,
                monitor produce, access the marketplace,
                and use AI-powered farming assistance.
            </p>

        </div>

    </div>

    <div class="auth-right">

        <form id="login-form">

            <h2>Login</h2>

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit">
                Sign In
            </button>

            <p>
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </form>

    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
