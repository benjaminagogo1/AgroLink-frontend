<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Agro-Shield</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-left">

        <h1>Welcome Back</h1>

        <p>
            Sign in to continue managing your farm,
            monitor produce, access the marketplace,
            and use AI-powered farming assistance.
        </p>

    </div>

    <div class="auth-right">

        <form id="login-form">

            <h2>Login</h2>

            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
            <a href="dashboard.html"> Sign In</a> Sign In
            </button>

            <p>
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </form>

    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
