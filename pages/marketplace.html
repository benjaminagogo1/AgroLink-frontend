<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Agro-Shield</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/marketplace.css">
</head>
<body>

<header class="navbar">

    <div class="logo">🌾 Agro-Shield</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="storage.html">Storage</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="ai-assistant.html">AI Assistant</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Logout</a>
    </nav>

</header>

<main class="marketplace">

    <div class="market-header">

        <div>
            <h1>Marketplace</h1>
            <p>Buy and sell agricultural products.</p>
        </div>

        <button>Sell Produce</button>

    </div>

    <input
        type="search"
        placeholder="Search products..."
        class="search-box"
    >

    <section class="product-grid">

        <div class="product-card">

            <img src="../assets/images/maize.jpg" alt="Maize">

            <h3>Maize</h3>

            <p class="price">₦65,000 / Bag</p>

            <p>Seller: Joseph Farms</p>

            <button>View Details</button>

        </div>

        <div class="product-card">

            <img src="../assets/images/rice.jpg" alt="Rice">

            <h3>Rice</h3>

            <p class="price">₦82,000 / Bag</p>

            <p>Seller: Benue Agro Ltd</p>

            <button>View Details</button>

        </div>

        <div class="product-card">

            <img src="../assets/images/soybeans.jpg" alt="Soybeans">

            <h3>Soybeans</h3>

            <p class="price">₦97,000 / Bag</p>

            <p>Seller: Green Harvest</p>

            <button>View Details</button>

        </div>

    </section>

</main>

<script src="../js/marketplace.js"></script>

</body>
</html>
