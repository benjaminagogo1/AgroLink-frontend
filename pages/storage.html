<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage | Agro-Shield</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/storage.css">
</head>
<body>

<header class="navbar">

    <div class="logo">🌾 Agro-Shield</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="storage.html">Storage</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="ai-assistant.html">AI Assistant</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main class="storage">

    <div class="page-header">

        <div>
            <h1>Storage Management</h1>
            <p>Manage all produce currently stored.</p>
        </div>

        <button id="add-btn">+ Add Produce</button>

    </div>

    <div class="toolbar">

        <input
            type="search"
            id="search"
            placeholder="Search produce..."
        >

    </div>

    <table>

        <thead>

            <tr>
                <th>Produce</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Location</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="storage-body">

        </tbody>

    </table>

</main>

<div class="modal" id="modal">

    <div class="modal-content">

        <h2>Add Produce</h2>

        <form id="storage-form">

            <input
                type="text"
                id="produce"
                placeholder="Produce Name"
                required
            >

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
                required
            >

            <select id="unit">

                <option>Bags</option>
                <option>Kg</option>
                <option>Tonnes</option>

            </select>

            <input
                type="text"
                id="location"
                placeholder="Storage Location"
                required
            >

            <div class="buttons">

                <button type="submit">
                    Save
                </button>

                <button
                    type="button"
                    id="close-btn"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/storage.js"></script>

</body>
</html>
